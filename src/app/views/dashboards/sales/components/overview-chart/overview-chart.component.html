<div class="row g-3">
  <div class="col-12 col-xl-4" *ngFor="let g of graficos">
    <div class="card h-100">

      <!-- Header -->
      <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0 d-flex align-items-center gap-2">
          <span class="rounded-circle d-inline-block"
            [style.background]="g.color"
            style="width:10px; height:10px"></span>
          {{ g.titulo }}
        </h6>
        <button *ngIf="!g.loading && !g.errorMsg && !g.sinDatos" class="btn btn-sm btn-link text-muted p-0"
          title="Actualizar" (click)="cargarGrafico(g)">
          <i class="ti ti-refresh"></i>
        </button>
      </div>

      <div class="card-body pt-3">

        <!-- Loading -->
        <div *ngIf="g.loading" class="text-center py-4">
          <div class="spinner-border spinner-border-sm" [style.color]="g.color" role="status"></div>
          <p class="mt-2 text-muted small mb-0">Cargando...</p>
        </div>

        <!-- Error -->
        <div *ngIf="!g.loading && g.errorMsg" class="alert alert-danger py-2 d-flex align-items-center gap-2 mb-0">
          <i class="ti ti-alert-circle"></i>
          <span class="small flex-grow-1">{{ g.errorMsg }}</span>
          <button class="btn btn-sm btn-outline-danger py-0 px-2" (click)="cargarGrafico(g)">
            <i class="ti ti-refresh"></i>
          </button>
        </div>

        <!-- Sin datos -->
        <div *ngIf="!g.loading && !g.errorMsg && g.sinDatos" class="text-center py-4 text-muted">
          <i class="ti ti-inbox fs-36 opacity-25"></i>
          <p class="mt-2 mb-0 small">Sin datos para el período</p>
        </div>

        <!-- KPI: valor actual + comparación + tendencia -->
        <div *ngIf="!g.loading && !g.errorMsg && !g.sinDatos">

          <div class="d-flex align-items-baseline justify-content-between flex-wrap gap-2">
            <h3 class="mb-0 fw-bold" [style.color]="g.color">
              {{ currency }}{{ formatCurrency(valorActual(g)) }}
            </h3>

            <span *ngIf="tieneComparacion(g); else sinComparacion"
              class="d-inline-flex align-items-center gap-1 fw-semibold small" [ngClass]="claseDelta(g)">
              <i class="ti" [ngClass]="iconoDelta(g)"></i>
              {{ deltaTexto(g) }}
            </span>
            <ng-template #sinComparacion>
              <span class="small text-muted">Sin histórico suficiente</span>
            </ng-template>
          </div>

          <small class="text-muted d-block mb-2">{{ periodoLabel() }}</small>

          <!-- Lectura dinámica: cambia al pasar el mouse o tocar una barra -->
          <div class="d-flex align-items-center justify-content-between mb-1">
            <small class="fw-semibold" [style.color]="g.color" style="font-size: 12px;">
              {{ diaFocoTexto(g) }}
            </small>
            <small class="text-muted" style="font-size: 10px;">{{ diasEnSparkline(g) }} días</small>
          </div>

          <!-- Sparkline: últimos días, hoy resaltado -->
          <apx-chart
            [series]="g.chartSeries"
            [chart]="g.chartOpts.chart"
            [plotOptions]="g.chartOpts.plotOptions"
            [dataLabels]="g.chartOpts.dataLabels"
            [states]="g.chartOpts.states"
            [colors]="g.chartOpts.colors"
            [tooltip]="g.chartOpts.tooltip"
          />
          <small class="text-muted d-block mt-1" style="font-size: 10px;">
            <i class="bi bi-hand-index-thumb me-1"></i>Toca o pasa el mouse sobre una barra para ver ese día
          </small>
        </div>

      </div>
    </div>
  </div>
</div>
